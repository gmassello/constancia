[project]
name = "constancia"
version = "0.1.0"
description = "Voice follow-up engine with longitudinal memory"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.22.0",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "twilio==9.11.0",
    "uvicorn[standard]==0.52.4",
    "websockets==16.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/packs.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a live DATABASE_URL"]

[tool.uv]
package = false
