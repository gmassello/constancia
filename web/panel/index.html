<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>constancia — patient panel</title>
    <script>
      try {
        var q = new URLSearchParams(location.search).get("lang")
        document.documentElement.dataset.theme =
          localStorage.getItem("constancia.theme") === "dark" ? "dark" : "light"
        document.documentElement.lang =
          q === "es" || q === "en" ? q : localStorage.getItem("constancia.lang") === "es" ? "es" : "en"
      } catch (e) {
        document.documentElement.dataset.theme = "light"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
